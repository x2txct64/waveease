{% extends "home.html" %}
{% load static %}

{% block title %}Email{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'aiassist/email.css' %}">
{% endblock %}

{% block content %}
    <h1>EMAIL FRAMER</h1>
        <div class="opt1">
            <div class="form-group">
                <label for="topic">Topic:</label>
                <textarea id="topic" placeholder="Type here" required></textarea>
            </div>

            <div class="form-group">
                <label for="addessed">Who is it addessed to:</label>
                <textarea name="addressed" id="addessed" placeholder="Type here" required></textarea>
            </div>

            <div class="form-group">
                <label for="formal">How Formal:</label>
                <textarea name="formal" id="type" placeholder="Type here" required></textarea>
            </div>

            <div class="form-group">
                <label for="info">Additional Information:</label>
                <textarea name="info" id="time" placeholder="Optional"></textarea>
            </div>

            <div class="form-group">
                <label for="materials">Upload Materials:(optional)</label>
                <input type="file" name="materials" id="materials" accept=".pdf,.doc,.docx,.pptx,.jpg,.png">
            </div>

            <div class="backbtn">
                <button type="submit" id="btn2">Enter</button>
            </div>
        </div>
{% endblock %}
