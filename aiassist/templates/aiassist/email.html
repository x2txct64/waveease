{% extends "home.html" %}
{% load static %}

{% block title %}Email{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'aiassist/tool.css' %}">
{% endblock %}

{% block content %}
<div id="loading-screen">
    <div class="spinner"></div>
</div>

<div class="full-wrap">
    <h1>EMAIL FRAMER</h1>
    <div class="opt1">
        <form id="teach-form" method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="form-group">
                <label for="topic">Topic:</label>
                <textarea name="topic" id="topic" placeholder="Type here" required></textarea>
            </div>

            <div class="form-group">
                <label for="addressed">Who Is It Addressed To:</label>
                <textarea name="addressed" id="addressed" placeholder="Type here" required></textarea>
            </div>

            <div class="form-group">
                <label for="info">Additional Information:</label>
                <textarea name="info" id="time" placeholder="Optional"></textarea>
            </div>

            <div class="form-group">
                <label for="materials">Upload Materials: (optional)</label>
                <input type="file" name="materials" id="materials" accept=".pdf,.doc,.docx,.pptx,.jpg,.png">
            </div>

            <div class="backbtn">
                <button type="submit" id="btn2">Enter</button>
            </div>

        </form>
    </div>

    {% if result %}
    <div class="output">
        <h2>AI-Generated Email:</h2>
        <div class="lesson-output">{{ result|safe }}</div>
    </div>
    {% endif %}
</div>

<script>
    // Show loading screen immediately when user submits the form
    document.getElementById("teach-form").addEventListener("submit", function () {
        document.getElementById("loading-screen").style.display = "flex";

        sessionStorage.setItem("scrollAfterSubmit", "true");
    });

    // Hide loading screen as soon as the new page is fully loaded
    window.addEventListener("load", function () {
        const loading = document.getElementById("loading-screen");
        if (loading) loading.style.display = "none";

        if (sessionStorage.getItem("scrollAfterSubmit") === "true") {
            window.scrollTo({
                top: 700,        // ← scroll amount (change this number)
                behavior: "smooth"
            });

            // Remove it so it ONLY happens once
            sessionStorage.removeItem("scrollAfterSubmit");
        }
    });
</script>
{% endblock %}
