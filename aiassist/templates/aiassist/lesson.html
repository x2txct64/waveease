{% extends "home.html" %}
{% load static %}

{% block title %}Lesson{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'aiassist/lesson.css' %}">
{% endblock %}

{% block content %}
    <h1>LESSON PLANNER</h1>
    <div class="full-wrap">
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="opt1">
                <div class="form-group">
                <label for="grade">Grade Level:</label>
                <select name="grade" id="grade" required>
                    <option value="" disabled selected>Select Grade</option>

                    <optgroup label="Elementary">
                        <option>1st grade</option>
                        <option>2nd grade</option>
                        <option>3rd grade</option>
                        <option>4th grade</option>
                        <option>5th grade</option>
                    </optgroup>

                    <optgroup label="Middle school">
                        <option>6th grade</option>
                        <option>7th grade</option>
                        <option>8th grade</option>
                    </optgroup>

                    <optgroup label="High School">
                        <option>9th grade</option>
                        <option>10th grade</option>
                        <option>11th grade</option>
                        <option>12th grade</option>
                    </optgroup>

                    <option>College</option>
                </select>

                </div>

                <div class="form-group">
                    <label for="topic">Topic:</label>
                    <textarea name="topic" id="topic" placeholder="Type here" required></textarea>
                </div>
                <div class="form-group">
                    <label for="objectives">Objectives:</label>
                    <textarea name="objectives" id="objectives" placeholder="Type here" required></textarea>
                </div>

                <div class="form-group">
                    <label for="assessment">Assessment:</label>
                    <textarea name="assessment" id="assessment" placeholder="Optional"></textarea>
                </div>

                <div class="form-group">
                    <label for="activities">Activities:</label>
                    <textarea name="activities" id="activities" placeholder="Optional"></textarea>
                </div>

                <div class="form-group">
                    <label for="less-dur">Lesson Duration:</label>
                    <textarea name="less-dur" id="less-dur" placeholder="Optional"></textarea>
                </div>

                <div class="form-group">
                    <label for="materials">Upload Materials:</label>
                    <input name="materials" type="file" id="materials" accept=".pdf,.doc,.docx,.pptx,.jpg,.png">
                </div>

                <div class="backbtn">
                    <button type="submit" id="btn2">Enter</button>
                </div>
            </div>
        </form>

        {% if result %}
            <h2>AI-Generated Lesson Plan:</h2>
            <div class="lesson-output">{{ result|safe }}</div>
        {% endif %}
    </div>
{% endblock %}
