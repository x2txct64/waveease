{% extends "home.html" %}
{% load static %}

{% block title %}Grade{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'aiassist/grade.css' %}">
{% endblock %}

{% block content %}
    <h1>GRADE ASSISTANT</h1>
        <div class="opt1">
            <div class="form-group">
            <label for="grade">Grade Level:</label>
            <select name="grade" id="grade" required>
                <option value="" disabled selected>Select Grade</option>

                <optgroup label="Elementary">
                    <option>1st grade</option>
                    <option>2nd grade</option>
                    <option>3rd grade</option>
                    <option>4th grade</option>
                    <option>5th grade</option>
                </optgroup>

                <optgroup label="Middle school">
                    <option>6th grade</option>
                    <option>7th grade</option>
                    <option>8th grade</option>
                </optgroup>

                <optgroup label="High School">
                    <option>9th grade</option>
                    <option>10th grade</option>
                    <option>11th grade</option>
                    <option>12th grade</option>
                </optgroup>

                <option>College</option>
            </select>

            </div>

            <div class="form-group">
                <label for="topic">Topic:</label>
                <textarea name="topic" id="topic" placeholder="Type here" required></textarea>
            </div>
            <div class="form-group">
                <label for="type">Type of assignment:</label>
                <textarea name="type" id="type" placeholder="Type here" required></textarea>
            </div>

            <div class="form-group">
                <label for="objective">Learning objective:</label>
                <textarea name="objective" id="objective" placeholder="Type here" required></textarea>
            </div>

            <div class="form-group">
                <label for="elements">Required elements:</label>
                <textarea name="elements" id="elements" placeholder="Optional"></textarea>
            </div>

            <div class="form-group">
                <label for="text">Student text:</label>
                <textarea name="text" id="text" placeholder="Optional"></textarea>
            </div>


            <div class="form-group">
                <label for="materials">Upload Materials:(optional)</label>
                <input type="file" name="materials" id="materials" accept=".pdf,.doc,.docx,.pptx,.jpg,.png">
            </div>

            <div class="backbtn">
                <button type="submit" id="btn2">Enter</button>
            </div>
        </div>
{% endblock %}
