{% extends "home.html" %}
{% load static %}

{% block title %}Quiz{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'aiassist/quiz.css' %}">
{% endblock %}

{% block content %}
    <div class="full-wrap">
        <h1>QUIZ MAKER</h1>
        <div class="opt1">
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="form-group">
                    <label for="grade">Grade Level:</label>
                    <select name="grade" id="grade" required>
                        <option value="" disabled selected>Select Grade</option>

                        <optgroup label="Elementary">
                            <option>1st grade</option>
                            <option>2nd grade</option>
                            <option>3rd grade</option>
                            <option>4th grade</option>
                            <option>5th grade</option>
                        </optgroup>

                        <optgroup label="Middle school">
                            <option>6th grade</option>
                            <option>7th grade</option>
                            <option>8th grade</option>
                        </optgroup>

                        <optgroup label="High School">
                            <option>9th grade</option>
                            <option>10th grade</option>
                            <option>11th grade</option>
                            <option>12th grade</option>
                        </optgroup>

                        <option>College</option>
                    </select>

                </div>

                <div class="form-group">
                    <label for="topic">Topic:</label>
                    <textarea name="topic" id="topic" placeholder="Type here" required></textarea>
                </div>
                <div class="form-group">
                    <label for="amount">Amount Of Questions:</label>
                    <textarea name="amount" id="amount" placeholder="Optional"></textarea>
                </div>

                <div class="form-group">
                    <label for="type">Question Type:</label>
                    <textarea name="type" id="type" placeholder="Optional"></textarea>
                </div>

                <div class="form-group">
                    <label for="difficulty">Quiz Difficulty:</label>
                    <textarea name="difficulty" id="difficulty" placeholder="Optional"></textarea>
                </div>

                <div class="form-group">
                    <label for="materials">Upload Materials:(optional)</label>
                    <input type="file" name="materials" id="materials" accept=".pdf,.doc,.docx,.pptx,.jpg,.png">
                </div>

                <div class="backbtn">
                    <button type="submit" id="btn2">Enter</button>
                </div>

            </form>
        </div>

        {% if result %}
        <div class="output">
            <h2>AI-Generated Quiz:</h2>
            <div class="lesson-output">{{ result|safe }}</div>
        </div>
        {% endif %}
    </div>
{% endblock %}
