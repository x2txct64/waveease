{% extends "home.html" %}
{% load static %}

{% block title %}Quiz{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'aiassist/tool.css' %}">
{% endblock %}

{% block content %}
<div id="loading-screen">
    <div class="spinner"></div>
</div>

<div class="full-wrap">
    <h1>QUIZ MAKER</h1>
    <div class="opt1">
        <form id="teach-form" method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="form-group">
                <label for="subject">Subject:</label>
                <select name="subject" id="subject" required>
                    <option value="" disabled selected>Select subject</option>
                    <option>Math</option>
                    <option>Science</option>
                    <option>History</option>
                    <option>English</option>
                    <option>World Languages</option>
                    <option>Art</option>
                    <option>Career and Technical Education</option>
                </select>
            </div>

            <div class="form-group">
                <label for="topic">Topic:</label>
                <textarea name="topic" id="topic" placeholder="Type here" required></textarea>
            </div>

            <div class="form-group">
                <label for="amount">Amount Of Questions:</label>
                <textarea name="amount" id="amount" placeholder="Optional"></textarea>
            </div>

            <div class="form-group">
                <label for="type">Question Type:</label>
                <textarea name="type" id="type" placeholder="Optional"></textarea>
            </div>

            <div class="form-group">
                <label for="difficulty">Quiz Difficulty:</label>
                <select name="difficulty" id="difficulty" placeholder="Optional">
                    <option value="" disabled selected>Select difficulty</option>
                    <option>1</option>
                    <option>2</option>
                    <option>3</option>
                    <option>4</option>
                    <option>5</option>
                </select>
            </div>

            <div class="form-group">
                <label for="materials">Upload Materials: (optional)</label>
                <input type="file" name="materials" id="materials" accept=".pdf,.doc,.docx,.pptx,.jpg,.png">
            </div>

            <div class="backbtn">
                <button type="submit" id="btn2">Enter</button>
            </div>

        </form>
    </div>

    {% if result %}
    <div class="output">
        <h2>AI-Generated Quiz:</h2>
        <div class="lesson-output">{{ result|safe }}</div>
    </div>
    {% endif %}
</div>

<script>
    // Show loading screen immediately when user submits the form
    document.getElementById("teach-form").addEventListener("submit", function() {
        document.getElementById("loading-screen").style.display = "flex";

        sessionStorage.setItem("scrollAfterSubmit", "true");
    });

    // Hide loading screen as soon as the new page is fully loaded
    window.addEventListener("load", function() {
        const loading = document.getElementById("loading-screen");
        if (loading) loading.style.display = "none";

      if (sessionStorage.getItem("scrollAfterSubmit") === "true") {
        window.scrollTo({
            top: 900,        // ← scroll amount (change this number)
            behavior: "smooth"
        });

        // Remove it so it ONLY happens once
        sessionStorage.removeItem("scrollAfterSubmit");
    }
    });
</script>
{% endblock %}
